name: Update Seoul E-Land xG Google Sheet

on:
  schedule:
    # 매일 00:00 UTC = KST 09:00
    - cron: "0 0 * * *"
  workflow_dispatch: {}

jobs:
  update-sheet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run scrape + sheet update
        env:
          # KLEAGUE_BASE_URL / MENU_CLICK_PATH / GOOGLE_WORKSHEET_NAME은 repo Variables로
          # 덮어쓸 수 있고, 설정 안 하면 아래 기본값(로컬에서 성공 확인된 값)을 사용한다.
          KLEAGUE_BASE_URL: ${{ vars.KLEAGUE_BASE_URL || 'https://data.kleague.com/' }}
          MENU_CLICK_PATH: ${{ vars.MENU_CLICK_PATH || '데이터센터,부가기록,기대득점,선수별 기대득점(xG)' }}
          GOOGLE_WORKSHEET_NAME: ${{ vars.GOOGLE_WORKSHEET_NAME || '서울이랜드_xG' }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
        run: python src/run_all.py

      - name: Upload debug screenshot on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshot
          path: data/debug_screenshot.png
          if-no-files-found: ignore
